name: Build iPhone app

# Builds the Cleared for Takeoff iPhone app on GitHub's Mac computers.
# Before the Apple keys are saved: it only checks that the app builds (no Apple account needed).
# After the keys are saved: it signs the app and sends it straight to TestFlight.
# Runs by hand: Actions tab > Build iPhone app > Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: xcode-27   # GitHub's Xcode 27 machine (the macos-26 one stops at Xcode 26.6)
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      ASC_KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
      ASC_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # iPhone Duo: only apps built with Xcode 27.1 (iOS 27.1 SDK) or newer fill the big inside screen.
      # Older builds show in a small window with black borders. Use Xcode 27.1, the machine's default
      # (the newest one there may be a beta, and Apple won't accept apps built with a beta Xcode).
      - name: Use Xcode 27.1 (needed for iPhone Duo)
        run: |
          if [ -d /Applications/Xcode_27.1.app ]; then sudo xcode-select -s /Applications/Xcode_27.1.app; fi
          xcodebuild -version
          V=$(xcodebuild -version | head -1 | awk '{print $2}')
          echo "Using Xcode $V: $(xcode-select -p)"
          if [ "$(printf '%s\n' 27.1 "$V" | sort -V | head -1)" != "27.1" ]; then
            echo "::error title=iPhone Duo::Only Xcode $V here. The app must be built with Xcode 27.1 or later to fill the iPhone Duo's inside screen."; exit 1
          fi
          if xcodebuild -version | grep -qi beta || xcode-select -p | grep -qi beta; then
            echo "::error::This Xcode is a beta; Apple won't accept the upload."; exit 1
          fi
          xcodebuild -showsdks | grep -i iphoneos

      - name: Install app tools
        run: npm install --no-audit --no-fund

      - name: Copy the website into the app
        run: node scripts/prepare-www.mjs

      - name: Create the iPhone project
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Make the icons and launch screen
        run: |
          python3 -m pip install --quiet pillow || python3 -m pip install --quiet --break-system-packages pillow
          python3 scripts/make-icons.py

      - name: Apply app settings (icon, permissions, version)
        run: python3 scripts/patch-ios.py

      # Home-screen widget: today's question of the day, same as the app (app/ios-widget)
      - name: Add the Question of the day widget
        run: |
          node scripts/make-widget.mjs
          gem list -i xcodeproj >/dev/null 2>&1 || sudo gem install xcodeproj --no-document
          ruby scripts/add-widget.rb

      # The app's own native pieces (app/ios-native): Hear it with Apple's Premium voices
      - name: Add the native speech engine
        run: ruby scripts/add-native.rb

      - name: Check that the app builds (no Apple account needed)
        if: env.ASC_KEY_P8 == ''
        run: |
          set -o pipefail
          xcodebuild build -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO | tail -40
          echo "The iPhone app builds. Save the Apple keys in GitHub to send it to TestFlight."

      - name: Build, sign, and send to TestFlight
        if: env.ASC_KEY_P8 != ''
        timeout-minutes: 30
        run: |
          set -o pipefail
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          BUILD=$((100 + GITHUB_RUN_NUMBER))
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          # Archive WITHOUT signing. Signing during archive asks Apple for a *development* profile,
          # which needs a registered test iPhone (our team has none). The export step below signs
          # for App Store distribution instead, using Apple's cloud signing + the API key.
          xcodebuild archive -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -60
          # The widget must be inside the app, or it won't show up on the phone
          ls "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app/PlugIns/TakeoffWidget.appex" >/dev/null \
            && echo "Widget is inside the app" || { echo "::error::TakeoffWidget.appex is missing from the app"; exit 1; }
          grep -q TakeoffSpeechPlugin "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app/capacitor.config.json" \
            && echo "Speech plugin is registered in the app" || { echo "::error::TakeoffSpeechPlugin missing from the app's plugin list"; exit 1; }
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          rm -f "$KEY"
          echo "Sent build $BUILD to TestFlight. It shows up in App Store Connect in about 10 to 30 minutes."
