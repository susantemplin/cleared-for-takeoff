name: Make App Store screenshots

# Makes App Store screenshots at Apple's exact sizes, in English and Spanish:
# iPhone Duo inside (2007x2853) and outside (1398x2034) screens, which earn the
# "optimized for iPhone Duo" badge, plus iPhone 6.9" and iPad 13".
# Runs by hand: Actions tab > Make App Store screenshots > Run workflow.
# When it finishes, download "app-store-screenshots" from the bottom of the run page.
# Pick "play" to get the Google Play sets instead (phone, 7-inch and 10-inch tablet, English),
# downloaded as "google-play-screenshots".
on:
  workflow_dispatch:
    inputs:
      store:
        description: 'apple or play'
        default: 'apple'
        type: choice
        options: [apple, play]

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the screenshot browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Take the screenshots
        env:
          STORE: ${{ inputs.store }}
        run: node app/scripts/store-screenshots.cjs store-screenshots

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.store == 'play' && 'google-play-screenshots' || 'app-store-screenshots' }}
          path: store-screenshots
          retention-days: 30

      # Also keep a copy on the "screenshots" branch (never touches the website), so they can be
      # checked and downloaded without the artifact zip.
      - name: Save a copy on the screenshots branch
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          B=screenshots; D=$(mktemp -d)
          if git fetch -q origin $B 2>/dev/null; then git worktree add -q $D origin/$B; else git worktree add -q --detach $D; (cd $D && git checkout -q --orphan $B && git rm -rqf .); fi
          rm -rf "$D/${{ inputs.store }}"; mkdir -p "$D/${{ inputs.store }}"; cp -r store-screenshots/. "$D/${{ inputs.store }}/"
          cd $D && git add -A && git commit -qm "Screenshots (${{ inputs.store }}) from run ${{ github.run_id }}" && git push -q origin HEAD:refs/heads/$B
